<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyAgent AI Chat & Memory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: flex; height: 100vh; background-color: #0d1117; color: #c9d1d9; overflow: hidden; position: relative; }
        
        /* Sidebar แถบข้างซ้าย */
        #sidebar { width: 260px; background-color: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 999; }
        #sidebar.closed { transform: translateX(-260px); width: 0; border: none; }
        .sidebar-header { padding: 10px; border-bottom: 1px solid #30363d; }
        #new-chat-btn { width: 100%; padding: 12px; background-color: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
        #new-chat-btn:hover { background-color: #30363d; }
        #history-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; }
        
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; margin-bottom: 6px; background: #21262d; border-radius: 6px; cursor: pointer; font-size: 14px; border: 1px solid transparent; }
        .history-item:hover, .history-item.active { background: #30363d; border-color: #58a6ff; }
        .chat-link-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 6px; }
        .chat-actions { display: none; gap: 4px; }
        .history-item:hover .chat-actions, .history-item.active .chat-actions { display: flex; align-items: center; }
        
        .action-chat-btn { background: transparent; border: none; cursor: pointer; font-size: 13px; padding: 4px; border-radius: 4px; transition: 0.2s; }
        .rename-btn { color: #58a6ff; }
        .rename-btn:hover { background: rgba(88, 166, 255, 0.2); }
        .delete-btn { color: #f25c54; }
        .delete-btn:hover { background: rgba(242, 92, 84, 0.2); }
        
        /* Main Chat Area กล่องกลาง */
        #main-container { flex: 1; display: flex; flex-direction: column; position: relative; height: 100%; background-color: #0d1117; min-width: 0; }
        .top-bar { padding: 12px; background-color: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; position: relative; }
        .top-bar-left { display: flex; align-items: center; flex: 1; min-width: 0; }
        #toggle-sidebar-btn { padding: 8px 14px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; cursor: pointer; margin-right: 15px; font-size: 14px; }
        #chat-title { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        
        /* ปุ่มเปิดแผงความจำสมอง */
        #toggle-memory-btn { padding: 8px 12px; background: #21262d; border: 1px solid #30363d; color: #ffb703; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; white-space: nowrap; }
        #toggle-memory-btn:hover { background: #30363d; }

        /* Memory Drawer แถบขวา (สำหรับเปิดส่องดูความจำ) */
        #memory-drawer { width: 280px; background-color: #161b22; border-left: 1px solid #30363d; display: flex; flex-direction: column; position: relative; transition: transform 0.3s ease; z-index: 998; }
        #memory-drawer.closed { transform: translateX(280px); width: 0; border: none; position: absolute; right: 0; height: 100%; }
        .memory-header { padding: 15px; border-bottom: 1px solid #30363d; font-weight: bold; color: #ffb703; display: flex; justify-content: space-between; align-items: center; }
        #close-memory-btn { background: transparent; border: none; color: #8b949e; cursor: pointer; font-size: 16px; }
        #memory-list { flex: 1; overflow-y: auto; padding: 12px; list-style: none; }
        .memory-item { background: #21262d; border: 1px solid #30363d; border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; line-height: 1.4; }
        .memory-delete-btn { background: transparent; border: none; color: #f25c54; cursor: pointer; font-size: 12px; padding: 2px; border-radius: 4px; display: flex; align-items: center; }
        .memory-delete-btn:hover { background: rgba(242, 92, 84, 0.2); }

        /* Chat Box & Input */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 8px; line-height: 1.5; word-wrap: break-word; font-size: 15px; position: relative; }
        .message.user { align-self: flex-end; background-color: #238636; color: white; border-bottom-right-radius: 2px; }
        .message.ai { align-self: flex-start; background-color: #161b22; border: 1px solid #30363d; color: #c9d1d9; border-bottom-left-radius: 2px; width: 100%; max-width: 85%; }
        
        .input-area { padding: 15px; border-top: 1px solid #30363d; display: flex; gap: 10px; background-color: #0d1117; }
        #message-input { flex: 1; padding: 12px; background-color: #161b22; border: 1px solid #30363d; color: #c9d1d9; border-radius: 6px; font-size: 16px; }
        #message-input:focus { border-color: #58a6ff; outline: none; }
        #send-button { padding: 0 18px; background-color: #238636; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        #send-button:hover { background-color: #2ea043; }

        .markdown-body { background-color: transparent !important; color: #c9d1d9 !important; }
        .markdown-body pre { position: relative; padding-top: 40px !important; background-color: #161b22 !important; border: 1px solid #30363d !important; }
        .copy-code-btn { position: absolute; top: 8px; right: 8px; padding: 4px 8px; background-color: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px; font-size: 12px; cursor: pointer; font-family: -apple-system, sans-serif; transition: 0.2s; z-index: 5; }
        .copy-code-btn:hover { background-color: #30363d; border-color: #8b949e; }

        @media (max-width: 768px) {
            #sidebar { position: absolute; height: 100%; left: 0; top: 0; transform: translateX(0); }
            #sidebar.closed { transform: translateX(-260px); }
            #memory-drawer { position: absolute; right: 0; top: 0; height: 100%; transform: translateX(0); }
            #memory-drawer.closed { transform: translateX(280px); }
            .message { max-width: 90%; }
            .message.ai { max-width: 90%; }
        }
    </style>
</head>
<body>
    <!-- Sidebar แถบซ้าย -->
    <div id="sidebar" class="closed">
        <div class="sidebar-header">
            <button id="new-chat-btn">➕ New Chat</button>
        </div>
        <ul id="history-list"></ul>
    </div>

    <!-- กล่องหลักแชท -->
    <div id="main-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <button id="toggle-sidebar-btn">☰ แถบข้าง</button>
                <h3 id="chat-title">MyAgent - New Chat</h3>
            </div>
            <button id="toggle-memory-btn">🧠 ความจำระบบ</button>
        </div>
        <div id="chat-box"></div>
        <div class="input-area">
            <input type="text" id="message-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
            <button id="send-button">ส่ง</button>
        </div>
    </div>

    <!-- Memory Drawer แถบขวา -->
    <div id="memory-drawer" class="closed">
        <div class="memory-header">
            <span>🧠 บันทึกความจำระยะยาว</span>
            <button id="close-memory-btn">✕</button>
        </div>
        <ul id="memory-list"></ul>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
