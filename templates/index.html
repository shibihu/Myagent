<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - MyAgent AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- Sidebar แถบประวัติซ้ายมือสไตล์ ChatGPT -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn" class="pop-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New chat
            </button>
            <button id="toggle-sidebar-btn" class="icon-btn pop-btn" title="Close sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </button>
        </div>
        <ul id="history-list"></ul>
    </div>

    <!-- พื้นที่แสดงแชทหลัก -->
    <div id="main-container">
        <!-- Top Navigation -->
        <div class="top-bar">
            <div class="top-bar-left">
                <button id="open-sidebar-btn" class="icon-btn pop-btn hidden" title="Open sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </button>
                <div id="chat-title">ChatGPT 4o</div>
            </div>
            <button id="toggle-memory-btn" class="pop-btn">🧠 Memory Context</button>
        </div>
        
        <!-- แชทบ็อกซ์ตรงกลาง -->
        <div id="chat-box-wrapper">
            <div id="chat-box"></div>
            
            <!-- Typing Indicator -->
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <!-- กล่อง Input ส่งข้อความด้านล่างสุด -->
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="Message MyAgent..." autocomplete="off">
                <button id="send-button" class="pop-btn" title="Send message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
            <div class="footer-note">MyAgent can make mistakes. Verify important info.</div>
        </div>
    </div>

    <!-- Memory Drawer แถบขวาสไตล์ Clean Overlay -->
    <div id="memory-drawer" class="closed">
        <div class="memory-header">
            <span>🧠 Long-term Memory</span>
            <button id="close-memory-btn" class="pop-btn">✕</button>
        </div>
        <ul id="memory-list"></ul>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
