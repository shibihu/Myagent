                                        <div class="text-[10px] text-textMuted flex items-center space-x-2">
                                            <i class="fa-solid fa-check-circle text-green-500"></i>
                                            <span>Ready</span>
                                        </div>
                                    </div>
                                    <div class={`flex-1 overflow-hidden font-mono text-[11px] text-gray-300 ${bottomTab === 'terminal' ? '' : 'p-3 overflow-y-auto space-y-1'}`}>
                                        {bottomTab === "terminal" && (
                                            <XtermTerminal />
                                        )}
                                        {bottomTab === "output" && (
                                            <div class="text-green-400">Compiled scripts successfully.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Right Panel: MyAgent AI Interactive chat Panel - Show on desktop, or on mobile if mobileView === 'chat' */}
                        {(!isMobile || isMobile && mobileView === "chat") && (
                            <div class="flex-1 md:w-96 md:flex-initial bg-panelBg border-l border-borderCol flex flex-col h-full w-full min-h-0">
                                <div class="h-12 border-b border-borderCol flex items-center justify-between px-4 font-bold text-xs bg-panelBg text-brandBlue flex-shrink-0">
                                    <div class="flex items-center space-x-1.5">
                                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                                        <span>MyAgent AI Chat Assistant</span>
                                    </div>
                                    {!isMobile && (
                                        <button class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                                    )}
                                </div>

                                {/* Chat messages feed */}
                                <div class="flex-1 overflow-y-auto p-4 space-y-4 min-h-0">
                                    {messages.length === 0 ? (
                                        <div class="text-center py-16 space-y-4">
                                            <i class="fa-solid fa-wand-magic-sparkles text-4xl text-gray-700 block"></i>
                                            <div class="text-sm font-semibold">How can MyAgent help you code today?</div>
                                            <p class="text-xs text-textMuted max-w-xs mx-auto">Select a file from the explorer on the left, type prompt on the input below to debug, fix, or optimize.</p>
                                        </div>
                                    ) : (
                                        messages.map((m, idx) => (
                                            <div key={idx} class={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>
                                                <div class="text-[10px] text-textMuted mb-1 font-semibold flex items-center space-x-1">
                                                    <i class={`fa-solid ${m.role === 'user' ? 'fa-user' : 'fa-robot text-brandBlue'}`}></i>
                                                    <span>{m.role === 'user' ? 'You' : 'MyAgent AI'}</span>
                                                </div>
                                                <div class={`p-3 rounded-lg text-xs max-w-[85%] leading-relaxed ${m.role === 'user' ? 'bg-[#32323e] text-white rounded-tr-none' : 'bg-surfaceBg text-gray-200 rounded-tl-none border border-borderCol'}`}>
                                                    <div class="markdown-body text-xs" style={{ background: 'transparent' }} dangerouslySetInnerHTML={{ __html: marked.parse(m.content) }}></div>
                                                    {m.model && (
                                                        <div class="text-[9px] text-textMuted mt-2 pt-1 border-t border-borderCol">
                                                            {m.model} | {m.total_tokens} tokens
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        ))
                                    )}

                                    {/* Real-time workflow status drawer */}
                                    {isTyping && (
                                        <div class="flex flex-col items-start">
                                            <div class="text-[10px] text-textMuted mb-1 font-semibold flex items-center space-x-1">
                                                <i class="fa-solid fa-spinner animate-spin text-brandBlue"></i>
                                                <span>Processing Pipeline</span>
                                            </div>
                                            <div class="w-full bg-surfaceBg border border-borderCol rounded-lg p-3">
                                                <div class="flex items-center justify-between cursor-pointer" onClick={() => setIsWorkflowExpanded(!isWorkflowExpanded)}>
                                                    <div class="flex items-center space-x-2">
                                                        <span class={`px-2 py-0.5 rounded text-[9px] font-bold ${isWorkflowCompleted ? 'bg-green-500/20 text-green-400 border border-green-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}`}>
                                                            {isWorkflowCompleted ? 'DONE' : 'THINK'}
                                                        </span>
                                                        <span class="text-[11px] font-medium text-gray-300 truncate max-w-[150px]">{statusText}</span>
                                                    </div>
                                                    <i class={`fa-solid fa-chevron-down text-gray-500 text-[10px] transition-transform ${isWorkflowExpanded ? 'rotate-180' : ''}`}></i>
                                                </div>
                                                {isWorkflowExpanded && (
                                                    <div class="mt-2.5 pt-2 border-t border-borderCol max-h-24 overflow-y-auto space-y-1 font-mono text-[10px] text-gray-400">
                                                        {workflowSteps.map((step, idx) => (
                                                            <div key={idx} class="flex items-center space-x-2">
                                                                <i class="fa-solid fa-check text-green-500 text-[9px]"></i>
                                                                <span>{step}</span>
                                                            </div>
                                                        ))}
                                                        {!isWorkflowCompleted && (
                                                            <div class="flex items-center space-x-2 text-brandBlue">
                                                                <i class="fa-solid fa-ellipsis animate-pulse"></i>
                                                                <span>Thinking...</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Action Buttons Box */}
                                <div class="p-3 bg-panelBg border-t border-borderCol space-y-2 flex-shrink-0">
                                    <div class="grid grid-cols-3 gap-2">
                                        <button onClick={() => triggerQuickAction("fix")} class="bg-surfaceBg hover:border-brandBlue hover:text-white border border-borderCol py-2 px-1 rounded text-[11px] font-medium flex items-center justify-center space-x-1.5 transition-colors">
                                            <i class="fa-solid fa-wrench text-amber-500"></i>
                                            <span>Fix</span>
                                        </button>
                                        <button onClick={() => triggerQuickAction("refactor")} class="bg-surfaceBg hover:border-brandBlue hover:text-white border border-borderCol py-2 px-1 rounded text-[11px] font-medium flex items-center justify-center space-x-1.5 transition-colors">
                                            <i class="fa-solid fa-rotate text-blue-400"></i>
                                            <span>Refactor</span>
                                        </button>
                                        <button onClick={() => triggerQuickAction("docs")} class="bg-surfaceBg hover:border-brandBlue hover:text-white border border-borderCol py-2 px-1 rounded text-[11px] font-medium flex items-center justify-center space-x-1.5 transition-colors">
                                            <i class="fa-regular fa-file-lines text-green-400"></i>
                                            <span>Docs</span>
                                        </button>
                                    </div>

                                    {/* Suggested Fix Diff / Viewer */}
                                    {suggestedFix && (
                                        <div class="bg-surfaceBg border border-amber-500/30 rounded p-2.5 space-y-2.5">
                                            <div class="flex items-center justify-between">
                                                <span class="text-[10px] text-amber-400 font-bold flex items-center space-x-1">
                                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                                    <span>SUGGESTED FIX DETECTED</span>
                                                </span>
                                                <button onClick={handleApplyFix} class="bg-green-600 hover:bg-green-500 text-white font-bold text-[10px] px-2.5 py-1 rounded transition-colors shadow-md">Apply Change</button>
                                            </div>
                                            <div class="font-mono text-[9px] max-h-32 overflow-y-auto border border-borderCol rounded bg-black/40 p-1.5 space-y-1">
                                                {suggestedFix.original && (
                                                    <div class="text-red-400 bg-red-500/10 p-1 rounded">
                                                        <span class="font-bold">- OLD:</span> {suggestedFix.original}
                                                    </div>
                                                )}
                                                <div class="text-green-400 bg-green-500/10 p-1 rounded">
                                                    <span class="font-bold">+ NEW:</span> {suggestedFix.replacement}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Chat input box */}
                                <div class="p-3 bg-panelBg border-t border-borderCol space-y-2 flex-shrink-0">
                                    <div class="bg-surfaceBg border border-borderCol rounded-lg p-2.5 flex items-center space-x-2">
                                        <button class="text-gray-400 hover:text-white text-sm" title="Attach assets"><i class="fa-solid fa-paperclip"></i></button>
                                        <input id="message-input-ide" type="text" value={inputMessage} onChange={(e) => setInputMessage(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleSendPrompt()} placeholder="Ask MyAgent..." class="bg-transparent border-none outline-none text-base md:text-xs text-white flex-1" />
                                        <div class="flex items-center space-x-2">
                                            <button onClick={() => setSearchWeb(!searchWeb)} class={`px-2 py-1 rounded text-[9px] font-bold ${searchWeb ? 'bg-brandBlue text-white' : 'bg-panelBg text-gray-400 hover:text-white'}`}>Search</button>
                                            <button onClick={handleSendPrompt} class="text-brandBlue hover:text-blue-400 text-sm"><i class="fa-solid fa-paper-plane"></i></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Mobile Bottom Navigation Sticky Bar - Only visible when isMobile is true */}
                    {isMobile && (
                        <div class="h-14 border-t border-borderCol bg-[#18181c] flex items-center justify-around text-[#858593] flex-shrink-0 z-50">
                            <button onClick={() => setMobileView("explorer")} class={`flex flex-col items-center justify-center space-y-1.5 flex-1 h-full hover:text-white transition-colors ${mobileView === "explorer" ? "text-brandBlue border-t-2 border-brandBlue font-semibold bg-surfaceBg/40" : ""}`}>
                                <i class="fa-regular fa-folder-open text-base"></i>
                                <span class="text-[10px]">Explorer</span>
                            </button>
                            <button onClick={() => setMobileView("editor")} class={`flex flex-col items-center justify-center space-y-1.5 flex-1 h-full hover:text-white transition-colors ${mobileView === "editor" ? "text-brandBlue border-t-2 border-brandBlue font-semibold bg-surfaceBg/40" : ""}`}>
                                <i class="fa-solid fa-code text-base"></i>
                                <span class="text-[10px]">Editor</span>
                            </button>
                            <button onClick={() => setMobileView("chat")} class={`flex flex-col items-center justify-center space-y-1.5 flex-1 h-full hover:text-white transition-colors ${mobileView === "chat" ? "text-brandBlue border-t-2 border-brandBlue font-semibold bg-surfaceBg/40" : ""}`}>
                                <i class="fa-regular fa-comment-dots text-base"></i>
                                <span class="text-[10px]">AI Chat</span>
                            </button>
                        </div>
                    )}

                    {/* Bottom Status Bar - Desktop only */}
                    {!isMobile && (
                        <div class="h-6 bg-brandBlue text-white text-[11px] flex items-center justify-between px-4 select-none flex-shrink-0">
                            <div class="flex items-center space-x-4">
                                <div class="flex items-center space-x-1">
                                    <i class="fa-solid fa-code-branch"></i>
                                    <span>main*</span>
                                </div>
                                <button onClick={fetchFilesList} class="hover:text-gray-200 transition-colors"><i class="fa-solid fa-rotate"></i></button>
                                <span>MyAgent: Ready</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <span>Ln 12, Col 42</span>
                                <span>Spaces: 4</span>
                                <span>UTF-8</span>
                                <span>Luau</span>
                                <i class="fa-regular fa-bell"></i>
                            </div>
                        </div>
                    )}

                    {/* Long term memory Drawer */}
                    {showMemoryDrawer && (
                        <div class="fixed top-0 right-0 h-full w-80 bg-panelBg border-l border-borderCol z-50 shadow-2xl flex flex-col animation-slide-in">
                            <div class="h-12 border-b border-borderCol flex items-center justify-between px-4 font-bold text-xs">
                                <span>Long-term Memory Context</span>
                                <button onClick={() => setShowMemoryDrawer(false)} class="text-gray-500 hover:text-white">✕</button>
                            </div>
                            <div class="flex-1 overflow-y-auto p-4 space-y-2">
                                <div class="text-xs text-textMuted mb-4">Learnings and persistent attributes MyAgent remembers about you:</div>
                                {memoryFacts.length === 0 ? (
                                    <div class="text-xs text-textMuted italic text-center py-12">No permanent memory is saved yet.</div>
                                ) : (
                                    memoryFacts.map((fact, idx) => (
                                        <div key={idx} class="p-2.5 bg-surfaceBg rounded border border-borderCol text-xs flex justify-between items-center gap-2">
                                            <span>{fact}</span>
                                            <button onClick={() => {
                                                fetch(`/memory/${idx}`, { method: 'DELETE' }).then(() => {
                                                    setMemoryFacts(prev => prev.filter((_, i) => i !== idx));
                                                    triggerToast("Removed memory attribute");
                                                });
                                            }} class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {/* MCP Configuration Modal */}
                    {showMcpModal && (
                        <div class="fixed inset-0 bg-black/65 flex items-center justify-center z-50 p-4">
                            <div class="bg-panelBg border border-borderCol rounded-lg w-full max-w-lg p-5 space-y-4">
                                <div class="flex items-center justify-between border-b border-borderCol pb-3">
                                    <span class="font-bold text-sm text-brandBlue">Model Context Protocol (MCP) Configuration</span>
                                    <button onClick={() => setShowMcpModal(false)} class="text-gray-500 hover:text-white">✕</button>
                                </div>
                                <p class="text-xs text-textMuted">MCP config setup enables connecting external workspace tools dynamically.</p>
                                <textarea value={mcpConfigText} onChange={(e) => setMcpConfigText(e.target.value)} placeholder='{ "mcpServers": {} }' class="w-full h-48 bg-surfaceBg border border-borderCol rounded p-3 font-mono text-xs text-gray-300 focus:outline-none focus:border-brandBlue" />
                                <div class="flex justify-end space-x-3 pt-2">
                                    <button onClick={() => setShowMcpModal(false)} class="bg-surfaceBg hover:bg-gray-800 text-xs py-2 px-4 rounded border border-borderCol">Cancel</button>
                                    <button onClick={() => {
                                        fetch('/api/mcp/config', {
                                            method: 'POST',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ config_raw: mcpConfigText })
                                        }).then(res => {
                                            if (res.ok) {
                                                triggerToast("Saved MCP server config!");
                                                setShowMcpModal(false);
                                            } else {
                                                triggerToast("Invalid JSON schema or payload", "error");
                                            }
                                        });
                                    }} class="bg-brandBlue hover:bg-blue-600 text-xs py-2 px-4 rounded font-bold">Save Config</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* GitHub Import/Clone Modal */}
                    {showGithubModal && (
                        <div class="fixed inset-0 bg-black/65 flex items-center justify-center z-50 p-4">
                            <div class="bg-panelBg border border-borderCol rounded-lg w-full max-w-md p-5 space-y-4">
                                <div class="flex items-center justify-between border-b border-borderCol pb-3">
                                    <span class="font-bold text-sm text-brandBlue">Import GitHub Repository</span>
                                    <button onClick={() => setShowGithubModal(false)} class="text-gray-500 hover:text-white">✕</button>
                                </div>
                                <div class="space-y-3">
                                    <label class="text-xs text-textMuted font-semibold">GitHub Personal Access Token</label>
                                    <input type="password" value={githubToken} onChange={(e) => setGithubToken(e.target.value)} placeholder="ghp_xxxx" class="w-full bg-surfaceBg border border-borderCol rounded p-2 text-xs focus:outline-none focus:border-brandBlue text-white" />
                                    <button onClick={handleConnectGitHub} class="w-full bg-brandBlue text-white hover:bg-blue-600 font-bold py-2 px-4 rounded text-xs transition-colors">Connect Account</button>
                                </div>
                                {githubRepos.length > 0 && (
                                    <div class="space-y-3 pt-2">
                                        <label class="text-xs text-textMuted font-semibold block">Select Repository</label>
                                        <select value={selectedRepoUrl} onChange={(e) => setSelectedRepoUrl(e.target.value)} class="w-full bg-surfaceBg border border-borderCol rounded p-2 text-xs text-white">
                                            <option value="">-- Choose Repository --</option>
                                            {githubRepos.map(r => (
                                                <option key={r.clone_url} value={r.clone_url}>{r.full_name}</option>
                                            ))}
                                        </select>
                                        <button onClick={handleCloneRepo} class="w-full bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded text-xs transition-colors">Clone Into Workspace</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    {% endraw %}
    </script>
</body>
</html>
