<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MyAgent</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>🤖 MyAgent</h1>

    <div id="chat-box">

        <div class="message ai">
            Hello! I'm MyAgent 👋
        </div>

    </div>

    <div class="input-area">

        <input
            id="message-input"
            type="text"
            placeholder="Type your message..."
        >

        <button id="send-button">
            Send
        </button>

    </div>

</div>

<script src="/static/script.js"></script>

</body>

</html>
