                                            </div>
                                        )}

                                        <div className="flex justify-end space-x-3 pt-3">
                                            <button
                                                type="button"
                                                onClick={() => { setShowAddServerForm(false); setEditingServerId(null); }}
                                                className="bg-surfaceBg hover:bg-gray-800 text-xs py-2 px-4 rounded border border-borderCol font-semibold"
                                            >
                                                Back
                                            </button>
                                            <button
                                                type="submit"
                                                className="bg-brandBlue hover:bg-blue-600 text-xs py-2 px-4 rounded font-bold text-white shadow"
                                            >
                                                {editingServerId ? "Update Server" : "Save Server"}
                                            </button>
                                        </div>
                                    </form>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const FileNode = ({ node, activeTab, onSelectFile, expandedFolders, onToggleFolder, gitChanges, isMobile, setMobileView }) => {
            if (!node) return null;

            const isDirectory = node.isDirectory;
            const isExpanded = !!expandedFolders[node.path];
            const gitStatus = gitChanges[node.path];

            let badgeColor = "";
            let badgeLabel = "";
            if (gitStatus === "M") {
                badgeColor = "text-amber-500 font-bold text-[10px]";
                badgeLabel = "M";
            } else if (gitStatus === "A" || gitStatus === "??" || gitStatus === "U") {
                badgeColor = "text-green-500 font-bold text-[10px]";
                badgeLabel = gitStatus === "??" ? "U" : "A";
            } else if (gitStatus === "D") {
                badgeColor = "text-red-500 font-bold text-[10px]";
                badgeLabel = "D";
            }

            if (isDirectory) {
                // If it's the root node, just render its children without rendering the root folder row
                if (node.path === "") {
                    return (
                        <div className="space-y-1">
                            {node.children && node.children.map(child => (
                                <FileNode
                                    key={child.path}
                                    node={child}
                                    activeTab={activeTab}
                                    onSelectFile={onSelectFile}
                                    expandedFolders={expandedFolders}
                                    onToggleFolder={onToggleFolder}
                                    gitChanges={gitChanges}
                                    isMobile={isMobile}
                                    setMobileView={setMobileView}
                                />
                            ))}
                        </div>
                    );
                }

                return (
                    <div className="space-y-1">
                        <button
                            onClick={() => onToggleFolder(node.path)}
                            className="w-full text-left px-2 py-1.5 rounded text-xs hover:bg-[#18181c] hover:text-white transition-colors flex items-center justify-between text-gray-400 font-medium"
                        >
                            <div className="flex items-center space-x-2 truncate">
                                <i className={`fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'} text-[9px] text-gray-500 w-3`}></i>
                                <i className="fa-regular fa-folder text-brandBlue"></i>
                                <span className="truncate">{node.name}</span>
                            </div>
                        </button>
                        {isExpanded && node.children && (
                            <div className="pl-3 border-l border-borderCol ml-3 space-y-1">
                                {node.children.map(child => (
                                    <FileNode
                                        key={child.path}
                                        node={child}
                                        activeTab={activeTab}
                                        onSelectFile={onSelectFile}
                                        expandedFolders={expandedFolders}
                                        onToggleFolder={onToggleFolder}
                                        gitChanges={gitChanges}
                                        isMobile={isMobile}
                                        setMobileView={setMobileView}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                );
            }

            // File Node
            const f = node.path;
            const ext = node.name.split('.').pop().toLowerCase();
            let iconClass = "fa-solid fa-file-code text-brandBlue";
            if (ext === "py") {
                iconClass = "fa-brands fa-python text-yellow-500";
            } else if (ext === "luau" || ext === "lua") {
                iconClass = "fa-solid fa-gem text-blue-400";
            }

            return (
                <button
                    onClick={() => { onSelectFile(f); if (isMobile) setMobileView("editor"); }}
                    className={`w-full text-left px-2 py-1.5 rounded text-xs hover:bg-[#18181c] hover:text-white transition-colors flex items-center justify-between ${activeTab === f ? 'bg-[#18181c] text-white border-l-2 border-brandBlue' : 'text-gray-400'}`}
                >
                    <div className="flex items-center space-x-2 truncate">
                        <span className="w-3"></span> {/* Spacing aligning with dir chevron */}
                        <i className={iconClass}></i>
                        <span className="truncate">{node.name}</span>
                    </div>
                    {badgeLabel && (
                        <span className={`${badgeColor} px-1.5`} title={gitStatus === "M" ? "Modified" : "Untracked/Added"}>
                            {badgeLabel}
                        </span>
                    )}
                </button>
            );
        };

        function App() {
            // Layout & Selection state
            const [files, setFiles] = useState([]);
            const [fileTree, setFileTree] = useState(null);
            const [expandedFolders, setExpandedFolders] = useState({});
            const [clonedRepos, setClonedRepos] = useState([]);
            const [activeRepo, setActiveRepo] = useState(null);
            const [openTabs, setOpenTabs] = useState([]);
            const [activeTab, setActiveTab] = useState(null);
            const [activeSidebar, setActiveSidebar] = useState("explorer");
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);
            const [bottomTab, setBottomTab] = useState("terminal");
            const [isMobile, setIsMobile] = useState(window.innerWidth < 768);
            const [mobileView, setMobileView] = useState("editor"); // "explorer", "editor", "chat"
            const [showMobileMenu, setShowMobileMenu] = useState(false);

            // Persistent Script Saving & Git State
            const [dirtyTabs, setDirtyTabs] = useState([]);
            const [gitChanges, setGitChanges] = useState({}); // filepath -> status ('M', 'A', 'D', etc)
            const autosaveTimeoutRef = useRef(null);

            // Git credentials and push panel state
            const [commitMessage, setCommitMessage] = useState("");
            const [gitRepoUrl, setGitRepoUrl] = useState("");
            const [gitBranchName, setGitBranchName] = useState("main");
            const [gitPat, setGitPat] = useState("");
            const [gitLoading, setGitLoading] = useState(false);

            // Chat & Sessions
            const [chatSessions, setChatSessions] = useState([]);
            const [currentChatId, setCurrentChatId] = useState(null);
            const [chatTitle, setChatTitle] = useState("MyAgent AI");
            const [messages, setMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState("");
            const [searchWeb, setSearchWeb] = useState(false);
            const [isTyping, setIsTyping] = useState(false);
            const [statusText, setStatusText] = useState("MyAgent: Ready");
            const [workflowSteps, setWorkflowSteps] = useState([]);
            const [isWorkflowExpanded, setIsWorkflowExpanded] = useState(true);
            const [isWorkflowCompleted, setIsWorkflowCompleted] = useState(false);

            // Memory & MCP States
            const [memoryFacts, setMemoryFacts] = useState([]);
            const [showMemoryDrawer, setShowMemoryDrawer] = useState(false);
            const [mcpConfigText, setMcpConfigText] = useState("");
            const [showMcpModal, setShowMcpModal] = useState(false);
            const [showGithubModal, setShowGithubModal] = useState(false);
            const [githubToken, setGithubToken] = useState("");
            const [githubRepos, setGithubRepos] = useState([]);
            const [selectedRepoUrl, setSelectedRepoUrl] = useState("");

            // Suggested Code Fix & Diff
            const [suggestedFix, setSuggestedFix] = useState(null); // { original: "", replacement: "", filepath: "" }

            // Auth session
            const [userSession, setUserSession] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [supabaseClient, setSupabaseClient] = useState(null);

            // Monaco Editor instance
            const [monacoInstance, setMonacoInstance] = useState(null);
            const [editorInstance, setEditorInstance] = useState(null);
            const editorRef = useRef(null);

            // Toast system
            const [toasts, setToasts] = useState([]);

            const triggerToast = (msg, type = "success") => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            };

            // Detect Language from file extension
            const getLanguageFromExtension = (filename) => {
                if (!filename) return "plaintext";
                const ext = filename.split('.').pop().toLowerCase();
                switch (ext) {
                    case 'js': case 'jsx': return 'javascript';
                    case 'ts': case 'tsx': return 'typescript';
                    case 'py': return 'python';
                    case 'html': return 'html';
                    case 'css': return 'css';
                    case 'json': return 'json';
                    case 'md': return 'markdown';
                    case 'lua': case 'luau': return 'lua';
                    case 'gd': return 'gdscript';
                    default: return 'plaintext';
                }
            };

            // Initialize Supabase, Auth, and periodic Git Change Fetcher
            useEffect(() => {
                const handleResize = () => {
                    setIsMobile(window.innerWidth < 768);
                };
                handleResize();
                window.addEventListener("resize", handleResize);

                // Restore saved git settings
                setGitRepoUrl(localStorage.getItem("myagent_git_repo_url") || "");
                setGitBranchName(localStorage.getItem("myagent_git_branch_name") || "main");
                setGitPat(localStorage.getItem("myagent_git_pat") || "");

                // Restore persistent GitHub Token
                const savedToken = localStorage.getItem("myagent_github_token") || "";
                setGithubToken(savedToken);

                // Fetch cloned repositories list
                fetchClonedReposList();

                // Periodically fetch git changes and files tree
                fetchGitChanges();
                fetchFilesList();
                const gitInterval = setInterval(() => {
                    fetchGitChanges();
                    fetchFilesList();
                }, 10000);

                const sUrl = window.NEXT_PUBLIC_SUPABASE_URL;
                const sKey = window.NEXT_PUBLIC_SUPABASE_ANON_KEY;

                const isValidUrl = (url) => {
                    if (!url || typeof url !== "string") return false;
                    if (url.includes("{{") || url.includes("}}")) return false;
                    try {
                        new URL(url);
                        return true;
                    } catch (_) {
                        return false;
                    }
                };

                let client = null;
                if (isValidUrl(sUrl) && sKey && !sKey.includes("{{") && typeof supabase !== 'undefined') {
                    try {
                        client = supabase.createClient(sUrl, sKey);
                        setSupabaseClient(client);
                        window.supabaseInstance = client;
                        console.log("Supabase client initialized in IDE React component.");
                    } catch (err) {
                        console.error("Supabase init error:", err);
                    }
                }

                if (client) {
                    client.auth.onAuthStateChange((event, session) => {
                        if (session && session.user) {
                            setUserSession({
                                username: session.user.user_metadata?.full_name || session.user.user_metadata?.user_name || "GitHub User",
                                avatar: session.user.user_metadata?.avatar_url || "https://github.com/identicons/guest.png",
                                email: session.user.email
                            });
                        } else {
                            setUserSession(null);
                        }
                        setAuthLoading(false);
                    });
                } else {
                    // Backend cookie verification fallback
                    fetch('/auth/me')
                        .then(res => res.ok ? res.json() : null)
                        .then(data => {
                            if (data && data.authenticated !== false) {
                                setUserSession({
                                    username: data.name || data.username || "GitHub User",
                                    avatar: data.avatar_url || "https://github.com/identicons/guest.png",
                                    email: data.email || `@${data.username}`
                                });
                            } else {
                                setUserSession(null);
                            }
                            setAuthLoading(false);
                        })
                        .catch(() => {
                            setUserSession(null);
                            setAuthLoading(false);
                        });
                }

                // Load chat sessions
                fetchChatSessions();

                // If last active repository exists, switch context on backend
                const lastActiveRepo = localStorage.getItem("myagent_active_repo");
                if (lastActiveRepo) {
                    fetch('/api/git/switch-repo', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ repo_name: lastActiveRepo })
                    })
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data && data.status === "success") {
                            setActiveRepo(lastActiveRepo);
                            fetchFilesList();
                            fetchGitChanges();
                        } else {
                            fetchFilesList();
                        }
                    })
                    .catch(() => {
                        fetchFilesList();
                    });
                } else {
                    fetchFilesList();
                }

                // Restoring active chat from local storage
                try {
                    const savedHistory = localStorage.getItem("myagent_chat_history");
                    const savedId = localStorage.getItem("myagent_chat_id");
                    const savedTitle = localStorage.getItem("myagent_chat_title");
                    if (savedHistory) {
                        setMessages(JSON.parse(savedHistory));
                        setCurrentChatId(savedId || null);
                        setChatTitle(savedTitle || "MyAgent AI");
                    }
                } catch (e) {
                    console.error("Failed to load local chat state", e);
                }

                return () => {
                    window.removeEventListener("resize", handleResize);
                    clearInterval(gitInterval);
                };
            }, []);

            // Auto-close tabs of deleted files
            useEffect(() => {
                if (files && files.length > 0) {
                    setOpenTabs(prevTabs => {
                        const filtered = prevTabs.filter(t => files.includes(t));
                        if (prevTabs.length !== filtered.length) {
                            // Some tabs were closed because the files were deleted
                            if (activeTab && !files.includes(activeTab)) {
                                if (filtered.length > 0) {
                                    setActiveTab(filtered[filtered.length - 1]);
                                } else {
                                    setActiveTab(null);
                                    if (editorInstance) {
                                        editorInstance.setValue("-- No file opened");
                                    }
                                }
                            }
                            return filtered;
                        }
                        return prevTabs;
                    });
                } else if (files && files.length === 0 && openTabs.length > 0) {
                    // Files list is empty (e.g. all deleted or root cleared)
                    setOpenTabs([]);
                    setActiveTab(null);
                    if (editorInstance) {
                        editorInstance.setValue("-- No file opened");
                    }
                }
            }, [files, activeTab, editorInstance]);

            // Setup Monaco Editor inside editorRef container
            useEffect(() => {
                if (!editorRef.current) return;

                monaco_loader.init().then(monaco => {
                    setMonacoInstance(monaco);

                    // Add Luau custom configurations
                    monaco.languages.register({ id: 'lua' });

                    const editor = monaco.editor.create(editorRef.current, {
                        value: "-- Open a file from the explorer on the left or click 'Open Folder' to start coding.",
                        language: "lua",
                        theme: "vs-dark",
                        automaticLayout: true,
                        minimap: { enabled: false },
                        fontSize: 14,
                        fontFamily: "'Fira Code', 'Courier New', monospace",
                        lineHeight: 22,
                        cursorBlinking: "smooth",
                        cursorSmoothCaretAnimation: "on",
                        scrollbar: {
                            vertical: "visible",
                            horizontal: "visible",
                            useShadows: false,
                        }
                    });

                    setEditorInstance(editor);

                    // Setup Ctrl + S handler
                    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, () => {
                        handleManualSave(editor);
                    });
                });

                return () => {
                    if (editorInstance) {
                        editorInstance.dispose();
                    }
                };
            }, [editorRef]);

            // Track editor content changes for dirty indicator and autosaving
            useEffect(() => {
                if (!editorInstance) return;

                const disposable = editorInstance.onDidChangeModelContent(() => {
                    if (!activeTab) return;

                    // Mark current tab as dirty
                    setDirtyTabs(prev => {
                        if (!prev.includes(activeTab)) {
                            return [...prev, activeTab];
                        }
                        return prev;
                    });

                    // Debounce autosave
                    if (autosaveTimeoutRef.current) {
                        clearTimeout(autosaveTimeoutRef.current);
                    }
                    autosaveTimeoutRef.current = setTimeout(() => {
                        handleAutosave(activeTab);
                    }, 1500);
                });

                return () => {
                    disposable.dispose();
                    if (autosaveTimeoutRef.current) {
                        clearTimeout(autosaveTimeoutRef.current);
                    }
                };
            }, [editorInstance, activeTab]);

            // Handle switching files (activeTab)
            useEffect(() => {
                if (!editorInstance || !monacoInstance || !activeTab) return;

                // Load file content
                fetch(`/api/ide/file?path=${encodeURIComponent(activeTab)}`)
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data && data.status === "success") {
                            const model = monacoInstance.editor.createModel(
                                data.content,
                                getLanguageFromExtension(activeTab)
                            );
                            editorInstance.setModel(model);
                            setStatusText(`Opened: ${activeTab}`);

                            // Safe clear dirty state for freshly opened file after model render
                            setTimeout(() => {
                                setDirtyTabs(prev => prev.filter(t => t !== activeTab));
                            }, 50);
                        } else {
                            triggerToast(`Failed to open file: ${activeTab}`, "error");
                        }
                    })
                    .catch(() => {
                        triggerToast(`Failed to load file content`, "error");
                    });
            }, [activeTab, editorInstance, monacoInstance]);

            // Fetch list of files recursive
            const fetchFilesList = () => {
                fetch('/api/ide/files')
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data && data.status === "success") {
                            setFiles(data.files || []);
                            setFileTree(data.tree || null);
                        }
                    });
            };

            const fetchClonedReposList = () => {
                fetch('/api/git/list-repos')
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data && data.status === "success") {
                            setClonedRepos(data.repos || []);
                            setActiveRepo(data.active_repo || null);
                        }
                    });
            };

            const switchActiveRepo = (repoName) => {
                fetch('/api/git/switch-repo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ repo_name: repoName })
                })
                .then(res => res.ok ? res.json() : null)
                .then(data => {
                    if (data && data.status === "success") {
                        setActiveRepo(repoName);
                        if (repoName) {
                            localStorage.setItem("myagent_active_repo", repoName);
                            triggerToast(`Switched workspace context to ${repoName}`, "success");
                        } else {
                            localStorage.removeItem("myagent_active_repo");
                            triggerToast(`Switched workspace context to Root Workspace`, "success");
                        }

                        // Electron dynamic terminal cwd synchronization
                        if (window.terminalAPI && window.terminalAPI.setActiveWorkspace) {
                            const relativePath = repoName ? `workspace/${repoName}` : 'workspace';
                            window.terminalAPI.setActiveWorkspace(relativePath)
                                .then(workspaceRes => {
                                    console.log("[Electron] Terminal directory synchronized:", workspaceRes);
                                })
                                .catch(workspaceErr => {
                                    console.error("[Electron] Terminal directory synchronization failed:", workspaceErr);
                                });
                        }

                        // Refresh everything instantly
                        fetchFilesList();
                        fetchGitChanges();
                        fetchClonedReposList();
                    } else {
                        triggerToast("Failed to switch repository context", "error");
                    }
                })
                .catch(() => {
                    triggerToast("Network error switching repository context", "error");
                });
            };

            const toggleFolder = (path) => {
                setExpandedFolders(prev => ({
                    ...prev,
                    [path]: !prev[path]
                }));
            };

            const createNewFileOrFolder = (type) => {
                const promptMsg = type === "file"
                    ? "Enter new file path (relative to workspace root, e.g. src/utils.py):"
                    : "Enter new folder path (relative to workspace root, e.g. src/components):";
                const path = prompt(promptMsg);
                if (!path || !path.trim()) return;

                fetch("/api/ide/create", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ path: path.trim(), type: type })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        triggerToast(data.message, "success");
                        fetchFilesList();
                        if (type === "file") {
                            handleSelectFile(path.trim());
                        }
                    } else {
                        triggerToast("Failed to create: " + (data.detail || data.message || "Unknown error"), "error");
                    }
                })
                .catch(err => {
                    console.error(err);
                    triggerToast("Network error creating item", "error");
                });
            };

            // Fetch chat sessions
            const fetchChatSessions = () => {
                fetch('/chats')
                    .then(res => res.ok ? res.json() : [])
                    .then(data => {
                        setChatSessions(data || []);
                    });
            };

            // Fetch git change detection info
            const fetchGitChanges = () => {
                fetch('/api/git/changes')
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data && data.status === "success") {
                            setGitChanges(data.changes || {});
                        }
                    })
                    .catch(err => console.error("Failed to fetch git changes:", err));
            };

            const saveFileImmediately = (filepath, content) => {
                if (autosaveTimeoutRef.current) {
                    clearTimeout(autosaveTimeoutRef.current);
                }
                return fetch('/api/ide/file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filepath, content })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        setDirtyTabs(prev => prev.filter(t => t !== filepath));
                        fetchGitChanges(); // Refresh git status automatically
                        fetchFilesList(); // Refresh files tree in case of additions
                        return true;
                    }
                    return false;
                })
                .catch(err => {
                    console.error("Save failed:", err);
                    return false;
                });
            };

            const handleAutosave = (filepath) => {
                if (!editorInstance) return;
                const content = editorInstance.getValue();
                saveFileImmediately(filepath, content);
            };

            // Manual Ctrl+S save
            const handleManualSave = (editor) => {
                if (!activeTab) {
                    triggerToast("No active file to save!", "error");
                    return;
                }
                const content = editor.getValue();
                saveFileImmediately(activeTab, content).then(success => {
                    if (success) {
                        triggerToast(`Saved ${activeTab} successfully`, "success");
                    } else {
                        triggerToast(`Failed to save file`, "error");
                    }
                });
            };

            // Handle manual input send to MyAgent AI
            const handleSendPrompt = async () => {
                if (inputMessage.trim() === "" || isTyping) return;
                const userMsg = inputMessage;
                setInputMessage("");

                // Display local message immediately
                const updatedMessages = [...messages, { role: "user", content: userMsg }];
                setMessages(updatedMessages);
                localStorage.setItem("myagent_chat_history", JSON.stringify(updatedMessages));

                setIsTyping(true);
                setWorkflowSteps([]);
                setIsWorkflowCompleted(false);
                setIsWorkflowExpanded(true);

                // Prepare file context
                let fileContextPayload = "";
                if (activeTab && editorInstance) {
                    const code = editorInstance.getValue();
                    fileContextPayload = `\n\n--- Active File Context: ${activeTab} ---\n${code}\n--- End Active File Context ---\n`;
                }

                // Call agent backend with prompt and file context
                const formData = new FormData();
                formData.append("message", `${fileContextPayload}${userMsg}`);
                if (currentChatId) {
                    formData.append("chat_id", currentChatId);
                }
                formData.append("search_web", searchWeb ? "true" : "false");

                try {
                    const endpoint = `/chat`;
                    const response = await fetch(endpoint, {
                        method: "POST",
                        headers: { "Accept": "text/event-stream" },
                        body: formData
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";
                    let aiReply = "";
                    let finalId = currentChatId;
                    let finalTitle = chatTitle;

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split("\n");
                        buffer = lines.pop();

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith("data: ")) {
                                const payloadStr = trimmed.slice(6);
                                try {
                                    const data = JSON.parse(payloadStr);
                                    if (data.type === "status") {
                                        setWorkflowSteps(prev => {
                                            if (!prev.includes(data.message)) {
                                                return [...prev, data.message];
                                            }
                                            return prev;
                                        });
                                        setStatusText(data.message);

                                        // Auto-refresh file explorer tree dynamically during tool execution
                                        if (data.tool_name) {
                                            fetchFilesList();
                                            fetchGitChanges();
                                        }

                                        // Auto-reload active editor tab if modified by AI
                                        if (data.filepath && activeTab && data.filepath === activeTab) {
                                            fetch(`/api/ide/file?path=${encodeURIComponent(activeTab)}`)
                                                .then(res => res.ok ? res.json() : null)
                                                .then(fileData => {
                                                    if (fileData && fileData.status === "success" && editorInstance) {
                                                        const currentVal = editorInstance.getValue();
                                                        if (fileData.content !== currentVal) {
                                                            editorInstance.setValue(fileData.content);
                                                            setDirtyTabs(prev => prev.filter(t => t !== activeTab));
                                                        }
                                                    }
                                                });
                                        }
                                    } else if (data.type === "final") {
                                        setIsWorkflowCompleted(true);
                                        aiReply = data.reply;
                                        if (data.chat_id) {
                                            finalId = data.chat_id;
                                            setCurrentChatId(data.chat_id);
                                            localStorage.setItem("myagent_chat_id", data.chat_id);
                                        }
                                        if (data.title) {
                                            finalTitle = data.title;
                                            setChatTitle(data.title);
                                            localStorage.setItem("myagent_chat_title", data.title);
                                        }

                                        // Auto-refresh on stream completion
                                        fetchFilesList();
                                        fetchGitChanges();

                                        if (activeTab) {
                                            fetch(`/api/ide/file?path=${encodeURIComponent(activeTab)}`)
                                                .then(res => res.ok ? res.json() : null)
                                                .then(fileData => {
                                                    if (fileData && fileData.status === "success" && editorInstance) {
                                                        const currentVal = editorInstance.getValue();
                                                        if (fileData.content !== currentVal) {
                                                            editorInstance.setValue(fileData.content);
                                                            setDirtyTabs(prev => prev.filter(t => t !== activeTab));
                                                        }
                                                    }
                                                });
                                        }
                                    } else if (data.type === "error") {
                                        triggerToast(data.message, "error");
                                    }
                                } catch (e) {
                                    console.error("SSE parse error", e);
                                }
                            }
                        }
                    }

                    if (aiReply) {
                        // Extract any code diff or suggested fix from reply
                        // Standard format: [FILE: <path>] <<<<<<< SEARCH ... ======= ... >>>>>>> REPLACE
                        const match = aiReply.match(/<<<<<<< SEARCH([\s\S]*?)=======([\s\S]*?)>>>>>>> REPLACE/);
                        if (match) {
                            const original = match[1].trim();
                            const replacement = match[2].trim();
                            setSuggestedFix({ original, replacement, filepath: activeTab });
                        }

                        const finalHistory = [...updatedMessages, { role: "ai", content: aiReply }];
                        setMessages(finalHistory);
                        localStorage.setItem("myagent_chat_history", JSON.stringify(finalHistory));
                    }

                    setIsTyping(false);
                    fetchChatSessions();
                } catch (err) {
                    console.error(err);
                    setIsTyping(false);
                    triggerToast("Chat endpoint connection failed", "error");
                }
            };

            // Apply Suggested Code Diff directly to Monaco editor
            const handleApplyFix = () => {
                if (!suggestedFix || !editorInstance) return;
                const code = editorInstance.getValue();
                const { original, replacement } = suggestedFix;

                if (original === "" || code.includes(original)) {
                    let updatedCode;
                    if (original === "") {
                        // Append to end of file
                        updatedCode = code + "\n" + replacement;
                    } else {
                        updatedCode = code.replace(original, replacement);
                    }
                    editorInstance.setValue(updatedCode);
                    setSuggestedFix(null);
                    triggerToast("Code changes applied successfully!", "success");

                    // Auto-save the applied code changes
                    handleManualSave(editorInstance);
                } else {
                    triggerToast("Cannot match the exact original block in the active file.", "error");
                }
            };

            // Trigger Quick Actions: Fix, Refactor, Docs
            const triggerQuickAction = (actionType) => {
                if (!activeTab) {
                    triggerToast("Please select a file from explorer first!", "error");
                    return;
                }
                let prompt = "";
                if (actionType === "fix") {
                    prompt = "Optimize the following active code tab for syntax, safety, and Roblox/Python guidelines. Find and fix any hidden bugs.";
                } else if (actionType === "refactor") {
                    prompt = "Refactor this module to improve execution performance and clean up nested statements.";
                } else if (actionType === "docs") {
                    prompt = "Write clean markdown documentation of the parameters, design, and use cases of this active script.";
                }
                setInputMessage(prompt);
            };

            // Handle opening directories/folders state
            const handleOpenFolderState = () => {
                // Since web sandbox operates directly in Workspace folder, simulate clone or trigger repos selection
                setShowGithubModal(true);
            };

            // Switch to a file and open tab
            const handleSelectFile = (path) => {
                // Save previous active tab if dirty
                if (activeTab && dirtyTabs.includes(activeTab) && editorInstance) {
                    saveFileImmediately(activeTab, editorInstance.getValue());
                }

                if (!openTabs.includes(path)) {
                    setOpenTabs([...openTabs, path]);
                }
                setActiveTab(path);
            };

            const handleCloseTab = (e, path) => {
                e.stopPropagation();

                // Save if dirty
                if (path === activeTab && dirtyTabs.includes(path) && editorInstance) {
                    saveFileImmediately(path, editorInstance.getValue());
                }

                const index = openTabs.indexOf(path);
                const filtered = openTabs.filter(t => t !== path);
                setOpenTabs(filtered);
                if (activeTab === path) {
                    if (filtered.length > 0) {
                        setActiveTab(filtered[Math.min(index, filtered.length - 1)]);
                    } else {
                        setActiveTab(null);
                    }
                }
            };

            const handleCommitPush = () => {
                if (!commitMessage.trim()) {
                    triggerToast("Please enter a commit message", "error");
                    return;
                }
                if (!gitRepoUrl.trim()) {
                    triggerToast("Please enter GitHub Repository URL", "error");
                    return;
                }
                if (!gitPat.trim()) {
                    triggerToast("Please enter GitHub Personal Access Token (PAT)", "error");
                    return;
                }

                setGitLoading(true);
                fetch('/api/git/commit-push', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        commit_message: commitMessage,
                        repo_url: gitRepoUrl,
                        branch_name: gitBranchName,
                        token: gitPat
                    })
                })
                .then(res => res.json())
                .then(data => {
                    setGitLoading(false);
                    if (data.status === "success") {
                        triggerToast("Successfully committed and pushed changes to GitHub!", "success");
                        setCommitMessage(""); // Clear commit message box
                        fetchGitChanges(); // Refresh changes list
                    } else {
                        triggerToast(data.message || "Failed to commit and push", "error");
                    }
                })
                .catch(err => {
                    setGitLoading(false);
                    triggerToast("Connection error during commit & push", "error");
                });
            };

            const handleGitPull = () => {
                setGitLoading(true);
                fetch('/api/git/pull', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        repo_url: gitRepoUrl,
                        branch_name: gitBranchName,
                        token: gitPat
                    })
                })
                .then(res => res.json())
                .then(data => {
                    setGitLoading(false);
                    if (data.status === "success") {
                        triggerToast("Successfully pulled latest changes from remote GitHub repository!", "success");
                        fetchGitChanges(); // Refresh changes list
                        fetchFilesList();  // Reload explorer tree to display newly pulled files
                    } else {
                        triggerToast(data.message || "Failed to pull remote changes", "error");
                    }
                })
                .catch(err => {
                    setGitLoading(false);
                    triggerToast("Connection error during git pull", "error");
                });
            };

            // Delete chat session
            const handleDeleteSession = async (e, id) => {
                e.stopPropagation();
                try {
                    await fetch(`/chats/${id}`, { method: "DELETE" });
                    if (currentChatId === id) {
                        setCurrentChatId(null);
                        setMessages([]);
                        setChatTitle("MyAgent AI");
                        localStorage.removeItem("myagent_chat_history");
                        localStorage.removeItem("myagent_chat_id");
                    }
                    fetchChatSessions();
                    triggerToast("Deleted session", "success");
                } catch (e) {
                    triggerToast("Failed to delete chat", "error");
                }
            };

            // Rename chat session
            const handleRenameSession = async (e, id, oldTitle) => {
                e.stopPropagation();
                const newTitle = prompt("Enter new name:", oldTitle);
                if (!newTitle) return;
                try {
                    await fetch(`/chats/${id}`, {
                        method: "PUT",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title: newTitle.trim() })
                    });
                    if (currentChatId === id) {
                        setChatTitle(newTitle);
                    }
                    fetchChatSessions();
                } catch (e) {
                    triggerToast("Rename failed", "error");
                }
            };

            // Connect GitHub account & retrieve repos
            const handleConnectGitHub = async () => {
                if (!githubToken.trim()) {
                    triggerToast("Please provide your token", "error");
                    return;
                }
                try {
                    const resp = await fetch('/api/github/repos', {
                        headers: { "X-GitHub-Token": githubToken }
                    });
                    const data = await resp.json();
                    if (data.status === "success" && data.repos) {
                        setGithubRepos(data.repos);
                        localStorage.setItem("myagent_github_token", githubToken);
                        triggerToast("Loaded repository listings!", "success");
                    } else {
                        triggerToast("Token not recognized. Please check and retry.", "error");
                    }
                } catch (err) {
                    triggerToast("Failed to connect GitHub APIs.", "error");
                }
            };

            // Clone selected GitHub repo
            const handleCloneRepo = async () => {
                if (!selectedRepoUrl) return;
                triggerToast("Cloning repository into workspace...", "success");
                try {
                    const resp = await fetch('/api/github/clone', {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ repo_url: selectedRepoUrl, token: githubToken })
                    });
                    const data = await resp.json();
                    if (data.status === "success") {
                        triggerToast("Successfully cloned repository!", "success");
                        setShowGithubModal(false);
                        localStorage.setItem("myagent_github_token", githubToken);
                        if (data.repo_name) {
                            switchActiveRepo(data.repo_name);
                        } else {
                            // Refresh tree and cloned repos list
                            fetchFilesList();
                            fetchGitChanges();
                            fetchClonedReposList();
                        }
                    } else {
                        triggerToast(data.message || "Failed to clone", "error");
                    }
                } catch (err) {
                    triggerToast("Server connection failed.", "error");
                }
            };

            // GitHub Login redirect
            const handleGitHubLoginRedirect = () => {
                if (supabaseClient) {
                    const redirectUrl = window.location.origin.endsWith('/') ? window.location.origin : (window.location.origin + '/');
                    supabaseClient.auth.signInWithOAuth({
                        provider: 'github',
                        options: { redirectTo: redirectUrl }
                    });
                } else {
                    window.location.href = "/auth/github/login";
                }
            };

            // GitHub logout
            const handleGitHubLogout = async () => {
                if (supabaseClient) {
                    await supabaseClient.auth.signOut();
                    window.location.reload();
                } else {
                    window.location.href = "/auth/logout";
                }
            };

            return (
                <div class="flex flex-col h-[100dvh] text-white bg-[#131313] select-none font-sans overflow-hidden">
                    {/* Toast Notification Bar */}
                    <div class="toast-container">
                        {toasts.map(t => (
                            <div key={t.id} class={`toast ${t.type === 'error' ? 'toast-error' : ''}`}>
                                <span>{t.type === 'error' ? '⚠️' : '✓'}</span>
                                <span>{t.msg}</span>
                            </div>
                        ))}
                    </div>

                    {/* Top Navbar */}
                    <div class="h-12 border-b border-borderCol flex items-center justify-between px-4 bg-panelBg relative flex-shrink-0">
                        <div class="flex items-center space-x-6">
                            <div class="flex items-center space-x-2 text-brandBlue font-bold text-lg">
                                <i class="fa-solid fa-code-merge"></i>
                                <span>MyAgent AI</span>
                            </div>
                            <div class="hidden md:flex items-center space-x-4 text-xs font-medium text-gray-300">
                                {["File", "Edit", "Selection", "View", "Go", "Run", "Terminal", "Help"].map(m => (
                                    <button key={m} class="hover:text-white transition-colors py-1 px-2 rounded hover:bg-surfaceBg">{m}</button>
                                ))}
                            </div>
                        </div>

                        {/* Top Bar Right: Settings and OAuth profile */}
                        {!isMobile ? (
                            <div class="flex items-center space-x-4">
                                <button onClick={() => setShowMcpModal(true)} class="text-xs text-gray-300 hover:text-white bg-surfaceBg px-3 py-1.5 rounded border border-borderCol transition-colors flex items-center space-x-1.5">
                                    <i class="fa-solid fa-plug"></i>
                                    <span>MCP Config</span>
                                </button>
                                <button onClick={() => { setShowMemoryDrawer(true); }} class="text-xs text-gray-300 hover:text-white bg-surfaceBg px-3 py-1.5 rounded border border-borderCol transition-colors flex items-center space-x-1.5">
                                    <i class="fa-solid fa-brain"></i>
                                    <span>Memory Context</span>
                                </button>
                                <div class="flex items-center space-x-2 border-l border-borderCol pl-4">
                                    {authLoading ? (
                                        <div class="animate-spin-custom h-4 w-4 border-2 border-t-brandBlue border-borderCol rounded-full"></div>
                                    ) : userSession ? (
                                        <div class="flex items-center space-x-2">
                                            <img src={userSession.avatar} class="h-6 w-6 rounded-full border border-borderCol" alt="avatar" />
                                            <span class="text-xs hidden sm:inline-block font-medium">{userSession.username}</span>
                                            <button onClick={handleGitHubLogout} class="text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 py-1 px-2 rounded" title="Log out">
                                                <i class="fa-solid fa-right-from-bracket"></i>
                                            </button>
                                        </div>
                                    ) : (
                                        <button onClick={handleGitHubLoginRedirect} class="bg-brandBlue text-white hover:bg-blue-600 transition-colors text-xs font-semibold px-3 py-1.5 rounded flex items-center space-x-1.5">
                                            <i class="fa-brands fa-github"></i>
                                            <span>Sign In</span>
                                        </button>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div class="flex items-center">
                                <button onClick={() => setShowMobileMenu(!showMobileMenu)} title="Toggle Menu" class="text-gray-300 hover:text-white p-2 text-lg focus:outline-none">
                                    <i class="fa-solid fa-bars"></i>
                                </button>
                                {showMobileMenu && (
                                    <div class="absolute right-4 top-12 bg-panelBg border border-borderCol rounded-lg shadow-xl py-2 z-50 min-w-[160px] animate-slide-in">
                                        <button onClick={() => { setShowMcpModal(true); setShowMobileMenu(false); }} class="w-full text-left px-4 py-2 text-xs hover:bg-surfaceBg flex items-center space-x-2">
                                            <i class="fa-solid fa-plug text-brandBlue"></i>
                                            <span>MCP Config</span>
                                        </button>
                                        <button onClick={() => { setShowMemoryDrawer(true); setShowMobileMenu(false); }} class="w-full text-left px-4 py-2 text-xs hover:bg-surfaceBg flex items-center space-x-2">
                                            <i class="fa-solid fa-brain text-purple-400"></i>
                                            <span>Memory Context</span>
                                        </button>
                                        <div class="border-t border-borderCol my-1"></div>
                                        {authLoading ? (
                                            <div class="px-4 py-2 flex justify-center"><div class="animate-spin-custom h-4 w-4 border-2 border-t-brandBlue border-borderCol rounded-full"></div></div>

                                                            </button>

                                        <div class="space-y-2">
                                            <button onClick={() => { setMessages([]); setCurrentChatId(null); setChatTitle("MyAgent AI"); if (isMobile) setMobileView("chat"); }} class="w-full bg-surfaceBg border border-borderCol hover:border-brandBlue hover:text-white py-2 px-3 rounded text-xs font-medium flex items-center justify-center space-x-1.5 transition-colors mb-3">

                                                            localStorage.setItem("myagent_chat_title", sess.title);

                                                            let badgeColor = "bg-amber-500/10 text-amber-400 border border-amber-500/20";

                                                                badgeText = "Modified";
                                                                badgeColor = "bg-amber-500/10 text-amber-400 border border-amber-500/20";

                                                                badgeText = status === "??" ? "Untracked" : "Added";
                                                                badgeColor = "bg-green-500/10 text-green-400 border border-green-500/20";

                                                                badgeText = "Deleted";

                                                                    <span class={`px-1.5 py-0.5 rounded text-[9px] font-bold ${badgeColor}`}>{badgeText}</span>
                                                                </div>
                                                            );

                                                            setGitBranchName(e.target.value);
                                                            localStorage.setItem("myagent_git_branch_name", e.target.value);
                                                        }}
                                                        placeholder="main"
                                                        class="w-full bg-panelBg border border-borderCol rounded p-1.5 text-xs focus:outline-none focus:border-brandBlue text-white"

                                                </div>

                                                <div class="space-y-1">

                                                        type="password"
                                                        value={gitPat}
                                                        onChange={(e) => {
                                                            setGitPat(e.target.value);
                                                            localStorage.setItem("myagent_git_pat", e.target.value);
                                                        }}
                                                        placeholder="ghp_xxxxxxxxxxxx"
                                                        class="w-full bg-panelBg border border-borderCol rounded p-1.5 text-xs focus:outline-none focus:border-brandBlue text-white font-mono"

                                                        {gitLoading ? (
                                                            <>
                                                                <i class="fa-solid fa-circle-notch animate-spin"></i>
                                                                <span>Syncing to GitHub...</span>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                                                <span>Commit & Push Changes</span>
                                                            </>
                                                        )}
                                                    </button>

                                                    <button
                                                        onClick={handleGitPull}
                                                        disabled={gitLoading}

                                                        {gitLoading ? (
                                                            <>
                                                                <i class="fa-solid fa-circle-notch animate-spin"></i>
                                                                <span>Pulling...</span>
                                                            </>
                                                        ) : (
                                                            <>
                                                                <i class="fa-solid fa-cloud-arrow-down"></i>
                                                                <span>Pull Changes</span>
                                                            </>
                                                        )}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                            </div>

                                            <i class="fa-solid fa-code text-[11px]"></i>

                                    {activeTab && (
                                        <button onClick={() => { if (editorInstance) handleManualSave(editorInstance); }} class="bg-surfaceBg hover:bg-gray-700 text-gray-300 hover:text-white px-2 py-0.5 rounded border border-borderCol transition-colors flex items-center space-x-1 text-[9px]">
                                            <i class={`fa-solid ${dirtyTabs.includes(activeTab) ? 'fa-floppy-disk text-amber-400 animate-pulse' : 'fa-check text-green-400'}`}></i>

                                        </button>

                                            { label: "[ ]", insert: "[]" },
                                            { label: "( )", insert: "()" },
                                            { label: "=", insert: "=" },
                                            { label: ":", insert: ":" },
                                            { label: ".", insert: "." },
                                            { label: "\"", insert: "\"\"" },
                                            { label: "--", insert: "-- " },
                                            { label: "Tab", insert: "    " },
                                            { label: "local", insert: "local " },
                                            { label: "function", insert: "function " },
                                            { label: "end", insert: "end" }
                                        ].map(sym => (
                                            <button key={sym.label} onClick={() => {
                                                if (editorInstance) {
                                                    const selection = editorInstance.getSelection();
                                                    const range = new monacoInstance.Range(
                                                        selection.startLineNumber,
                                                        selection.startColumn,
                                                        selection.endLineNumber,
                                                        selection.endColumn
                                                    );
                                                    const id = { major: 1, minor: 1 };
                                                    const text = sym.insert;
                                                    const op = { identifier: id, range: range, text: text, forceMoveMarkers: true };
                                                    editorInstance.executeEdits("my-source", [op]);
                                                    editorInstance.focus();
                                                }
                                            }} class="bg-surfaceBg hover:bg-gray-700 text-white text-xs font-semibold py-1 px-3 rounded border border-borderCol transition-colors flex-shrink-0 active:scale-95">
                                                {sym.label}
                                            </button>

                                            <p class="text-xs text-textMuted max-w-xs mx-auto">Select a file from the explorer on the left, type prompt on the input below to debug, fix, or optimize.</p>
                                        </div>
                                    ) : (
                                        messages.map((m, idx) => (
                                            <div key={idx} class={`flex flex-col ${m.role === 'user' ? 'items-end' : 'items-start'}`}>

                                                    <i class={`fa-solid ${m.role === 'user' ? 'fa-user' : 'fa-robot text-brandBlue'}`}></i>
                                                    <span>{m.role === 'user' ? 'You' : 'MyAgent AI'}</span>
                                                </div>

                                                            {m.model} | {m.total_tokens} tokens
                                                        </div>

                                                </div>
                                            </div>
