<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - MyAgent AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Sidebar แถบประวัติซ้ายมือ -->
    <div id="sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn" class="pop-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New chat
            </button>
            <button id="toggle-sidebar-btn" class="icon-btn pop-btn" title="Close sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
            </button>
        </div>
        <ul id="history-list"></ul>
    </div>

    <!-- พื้นที่แสดงแชทหลัก -->
    <div id="main-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <button id="open-sidebar-btn" class="icon-btn pop-btn hidden" title="Open sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                </button>
                <div id="chat-title">ChatGPT 4o</div>
            </div>
            <button id="toggle-memory-btn" class="pop-btn" title="Memory Context">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; display: inline-block; vertical-align: text-bottom; margin-right: 6px;">
                    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
                    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
                    <path d="M12 5v13"/>
                </svg>Memory Context
            </button>
        </div>
        
        <div id="chat-box-wrapper">
            <div id="chat-box"></div>
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>

        <!-- กล่องอินพุตพร้อมปุ่มเปิด/ปิดระบบค้นหาเว็บสดๆ -->
        <div class="input-container">
            <div class="input-wrapper">
                <button id="search-web-toggle" class="pop-btn" title="Toggle Web Search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>Search</span>
                </button>
                <input type="text" id="message-input" placeholder="Message MyAgent..." autocomplete="off">
                <button id="send-button" class="pop-btn" title="Send message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
            <div class="footer-note">MyAgent can make mistakes. Verify important info.</div>
        </div>
    </div>

    <div id="memory-drawer" class="closed">
        <div class="memory-header">
            <span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px; display: inline-block; vertical-align: text-bottom; margin-right: 6px;">
                    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
                    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
                    <path d="M12 5v13"/>
                </svg>Long-term Memory
            </span>
            <button id="close-memory-btn" class="pop-btn">✕</button>
        </div>
        <ul id="memory-list"></ul>
    </div>

    <!-- Gorgeous custom GUI Modal Overlay replacement for native prompt/confirm -->
    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-container pop-btn">
            <div class="modal-header">
                <span id="modal-title">MyAgent AI</span>
                <button id="modal-close-btn" class="pop-btn">✕</button>
            </div>
            <div class="modal-body">
                <p id="modal-message"></p>
                <input type="text" id="modal-input" class="hidden" autocomplete="off">
            </div>
            <div class="modal-footer">
                <button id="modal-cancel-btn" class="pop-btn secondary-btn">Cancel</button>
                <button id="modal-ok-btn" class="pop-btn primary-btn">OK</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
